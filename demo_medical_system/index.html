<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="demo-type" content="screenshot-batch" /><title>本地病例查询工作台</title><link rel="stylesheet" href="styles.css" /></head>
  <body><main class="page-shell">
    <section id="login-panel" class="panel login-panel"><p class="eyebrow">LOCAL QA WORKBENCH</p><h1>病例截图批处理演示</h1><p class="notice">仅用于本地 UI-TARS、队列、截图同步和 OCR 测试。全部患者和记录均为虚构。</p><form id="login-form"><label>用户名<input id="username" value="demo" autocomplete="off" /></label><label>密码<input id="password" type="password" value="demo" autocomplete="off" /></label><button type="submit">登录病例工作台</button><p id="login-error" class="error" role="alert"></p></form></section>
    <section id="app-panel" class="panel hidden"><header class="topbar"><div><p class="eyebrow">LOCAL QA WORKBENCH</p><h1>病例截图工作台</h1></div><div class="toolbar"><span class="pill">截图模式</span><button id="logout-button" class="secondary">退出</button></div></header>
      <section class="filter-panel"><div class="filter-grid"><label>姓名 / 患者编号<input id="search-input" placeholder="可输入姓名或 DEMO-001" /></label><label>科室<select id="department-filter"><option value="">全部科室</option></select></label><label>状态<select id="status-filter"><option value="">全部状态</option><option>待审核</option><option>待补充</option><option>已复核</option><option>已归档</option></select></label><label>起始日期<input id="from-date" type="date" /></label><label>结束日期<input id="to-date" type="date" /></label><label>排序<select id="sort-filter"><option value="updated-desc">最近更新</option><option value="risk-desc">风险优先</option><option value="name-asc">姓名</option></select></label></div><div class="filter-actions"><button id="search-button">应用筛选</button><button id="reset-button" class="secondary">重置条件</button></div></section>
      <div class="workbench-grid"><section class="results-column"><div class="section-heading"><h2>患者列表</h2><span id="result-summary" class="meta"></span></div><div id="results" class="results" aria-live="polite"></div><div class="pagination"><button id="prev-page" class="secondary">上一页</button><span id="page-info"></span><button id="next-page" class="secondary">下一页</button></div></section><section id="details" class="details hidden" aria-live="polite"></section></div>
    </section>
  </main><script src="app.js"></script></body>
</html>
